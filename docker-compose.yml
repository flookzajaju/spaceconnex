services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spaceconnex
      POSTGRES_USER: spaceconnex
      POSTGRES_PASSWORD: spaceconnex
    ports: ["5432:5432"]
    volumes:
      - space_connex_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spaceconnex -d spaceconnex"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  space_connex_data:
